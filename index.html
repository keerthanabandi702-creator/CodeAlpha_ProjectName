<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Horizons Gallery</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Four Horizons</h1>
    <p>Twelve generated landscapes. Filter by terrain, then open any image to browse in full size.</p>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>
  <main class="grid" id="grid"></main>

  <figure class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close" aria-label="Close viewer">&times;</button>
    <button class="nav prev" aria-label="Previous image">&#8249;</button>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
    <button class="nav next" aria-label="Next image">&#8250;</button>
  </figure>

  <script src="script.js"></script>
</body>
</html>
